name: Deploy to GitHub Pages

on:
  push:
    branches: ["ccr-29e620f5-jlux4b", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deployment; newer runs supersede in-progress ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-contained page
        run: |
          python3 web/build_site.py
          mkdir -p _site
          cp web/index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages (enables it if the token is allowed to)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
